# Filtra bots de redes sociales por User-Agent para servir meta tags Open
# Graph en /producto/:id (ver docs/superpowers/specs/2026-08-15-og-producto-design.md).
# Debe mantenerse en sync manualmente con backend/src/lib/botDetector.js —
# trade-off documentado en el spec, no un descuido.
map $http_user_agent $es_bot_og {
    default 0;
    "~*facebookexternalhit" 1;
    "~*facebot" 1;
    "~*twitterbot" 1;
    "~*whatsapp" 1;
    "~*linkedinbot" 1;
    "~*slackbot" 1;
    "~*telegrambot" 1;
    "~*discordbot" 1;
    "~*pinterest" 1;
    "~*redditbot" 1;
    "~*skypeuripreview" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # yumiCatalofoFrontend y yumiCatalogoBackend son repos/servicios Docker
    # separados en EasyPanel, sin red interna compartida garantizada — el
    # proxy usa la URL pública HTTPS del backend, no un nombre de servicio.
    # `proxy_pass` con URI no puede vivir dentro de un `if`, así que el `if`
    # solo redirige internamente (named location) a @og_proxy, que sí puede
    # tenerlo.
    location /producto/ {
        if ($es_bot_og = 1) {
            rewrite ^/producto/(.*)$ /__og_proxy/$1 last;
        }
        try_files $uri /index.html;
    }

    location /__og_proxy/ {
        internal;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_ssl_server_name on;
        proxy_set_header Host yima-yumicatalogobackend.q4dikb.easypanel.host;
        rewrite ^/__og_proxy/(.*)$ /og/producto/$1 break;
        proxy_pass https://yima-yumicatalogobackend.q4dikb.easypanel.host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
