# Desvía a los crawlers al HTML server-side del backend en vez de servirles la
# SPA (que no ejecutan, o ejecutan tarde y a medias).
#
# SYNC MANUAL con backend/src/lib/botDetector.js — trade-off documentado, no un
# descuido: los dos repos se publican por separado. AL TOCAR ESTA LISTA, TOCAR
# TAMBIÉN ESE ARCHIVO.
map $http_user_agent $es_bot_og {
    default 0;
    # Redes sociales — preview de un link compartido.
    "~*facebookexternalhit" 1;
    "~*facebot" 1;
    "~*twitterbot" 1;
    "~*whatsapp" 1;
    "~*linkedinbot" 1;
    "~*slackbot" 1;
    "~*telegrambot" 1;
    "~*discordbot" 1;
    "~*pinterest" 1;
    "~*redditbot" 1;
    "~*skypeuripreview" 1;
    # Buscadores. `googlebot` matchea también Googlebot-Image y Googlebot-News.
    "~*googlebot" 1;
    # UA de la Prueba de Resultados Enriquecidos de Google — distinto de
    # "googlebot". Sin esta línea la herramienta recibe la SPA cruda.
    "~*google-inspectiontool" 1;
    "~*bingbot" 1;
    "~*duckduckbot" 1;
    "~*applebot" 1;
    "~*yandexbot" 1;
    # Crawlers de sistemas de IA.
    "~*gptbot" 1;
    "~*claudebot" 1;
    "~*perplexitybot" 1;
    "~*oai-searchbot" 1;
}

# Content-Security-Policy de la SPA. Es la CSP que de verdad importa del sitio:
# el backend sirve JSON/streams y solo HTML para bots (que no evalúan CSP), así
# que su helmet la deja apagada a propósito y la política vive acá.
#
# Se define una sola vez como variable para no repetir la cadena en los cinco
# bloques que la emiten (mismo gotcha de `add_header` que las otras cabeceras de
# abajo). Cada directiva y por qué:
#   - script-src 'self' SIN 'unsafe-inline': el build de Vite no emite ningún
#     <script> inline (verificado sobre dist/index.html — solo un <script
#     type="module" src="/assets/..."> externo), así que se puede prohibir el
#     script inline por completo. ESTO es lo que corta el robo del token admin
#     de localStorage vía un XSS: sin ejecución de script inyectado, no hay
#     exfiltración. Volver a 'unsafe-inline' acá anula esa protección.
#   - style-src 'unsafe-inline': React aplica estilos inline (atributo style=)
#     en varios componentes; sin esto la SPA se rompe visualmente. La inyección
#     de estilos es mucho menos grave que la de scripts, así que el trade-off es
#     aceptable. fonts.googleapis.com sirve el CSS de las tipografías.
#   - font-src gstatic: los archivos de fuente de Google Fonts.
#   - img-src / media-src: 'self' (favicon, og-default), data: y blob: (previews
#     del editor de producto), res.cloudinary.com (CDN de fotos/video) y el
#     backend (proxy de media legada de Drive).
#   - connect-src limita los fetch a 'self' y a la API pública. Junto con
#     script-src es la otra mitad que impide la exfiltración: un script inyectado
#     tampoco podría mandar datos a un origen de un atacante.
#   - frame-ancestors 'none' refuerza el X-Frame-Options de abajo.
# Verificada en navegador (Playwright sobre el build de producción: home,
# colección y panel admin) — cero violaciones de CSP.
map $host $csp_policy {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://api.yima-productos.com; media-src 'self' blob: https://res.cloudinary.com https://api.yima-productos.com; connect-src 'self' https://api.yima-productos.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; frame-src 'none'; worker-src 'self' blob:";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Cabeceras de seguridad ---
    #
    # `always` para que también se manden en respuestas de error (404, 5xx):
    # sin eso, nginx las omite justo en las páginas que un atacante puede
    # provocar a voluntad.
    #
    # DENY y no SAMEORIGIN: el panel admin (/catalogo/admin) se sirve desde
    # esta misma SPA y su pantalla de login enmarcada es el vector clásico de
    # clickjacking. Nada de este sitio necesita enmarcarse a sí mismo.
    add_header X-Frame-Options "DENY" always;
    # Impide que el browser adivine el tipo de un archivo ignorando el
    # Content-Type (un .js servido como texto ejecutándose igual, etc.).
    add_header X-Content-Type-Options "nosniff" always;
    # Cross-origin manda solo el origen, nunca la ruta completa. Es el default
    # de los browsers modernos; declararlo lo vuelve explícito e inmune a un
    # cambio de default. No rompe el analytics propio: `EventoTrafico.referrer`
    # guarda el origen del tráfico, no la URL exacta (ver CLAUDE.md).
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #
    # HSTS: fuerza HTTPS en todo el dominio y sus subdominios. Este nginx es el
    # borde HTTPS del sitio, así que la cabecera se emite acá y NO desde el
    # backend (helmet con `hsts: false`), para no dividir en dos lugares una
    # decisión de dominio único. `includeSubDomains` es correcto porque
    # api.yima-productos.com también sirve HTTPS. Es una directiva que el
    # browser recuerda hasta que expire el max-age (difícil de revertir), de ahí
    # el año estándar, apropiado una vez que el dominio sirve HTTPS estable.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP definida arriba (map $csp_policy). Ver el comentario largo por qué
    # cada directiva. Repetida —como las demás cabeceras— en cada `location`
    # que define sus propios `add_header`.
    add_header Content-Security-Policy $csp_policy always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # yumiCatalofoFrontend y yumiCatalogoBackend son repos/servicios Docker
    # separados en EasyPanel, sin red interna compartida garantizada — el
    # proxy usa la URL pública HTTPS del backend, no un nombre de servicio.
    # `proxy_pass` con URI no puede vivir dentro de un `if`, así que el `if`
    # solo redirige internamente (named location) a @og_proxy, que sí puede
    # tenerlo.
    location /producto/ {
        if ($es_bot_og = 1) {
            rewrite ^/producto/(.*)$ /__og_proxy/$1 last;
        }
        try_files $uri /index.html;
    }

    location /__og_proxy/ {
        internal;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_ssl_server_name on;
        proxy_set_header Host api.yima-productos.com;
        rewrite ^/__og_proxy/(.*)$ /og/producto/$1 break;
        proxy_pass https://api.yima-productos.com;
    }

    # Home, colección y categoría: mismo mecanismo que /producto/ de arriba,
    # pero con un proxy propio (`/__og_proxy_pagina/`) porque el rewrite de
    # destino no lleva el prefijo fijo `/og/producto/` sino `/og/<lo que sea>`.
    # El orden de declaración NO es lo que las protege de `location / {}` (más
    # abajo, línea ~161): nginx no prioriza locations de prefijo por orden
    # textual, sino por el PREFIJO MÁS LARGO que matchea, y `=` es coincidencia
    # exacta con prioridad absoluta sobre cualquier prefijo. Van agrupadas acá
    # por legibilidad, junto al resto de las rutas de página.
    location = / {
        if ($es_bot_og = 1) {
            rewrite ^.*$ /__og_proxy_pagina/home last;
        }
        try_files $uri /index.html;
    }

    location = /coleccion {
        if ($es_bot_og = 1) {
            rewrite ^.*$ /__og_proxy_pagina/coleccion last;
        }
        try_files $uri /index.html;
    }

    location /coleccion/categoria/ {
        if ($es_bot_og = 1) {
            rewrite ^/coleccion/categoria/(.*)$ /__og_proxy_pagina/categoria/$1 last;
        }
        try_files $uri /index.html;
    }

    location /__og_proxy_pagina/ {
        internal;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_ssl_server_name on;
        proxy_set_header Host api.yima-productos.com;
        rewrite ^/__og_proxy_pagina/(.*)$ /og/$1 break;
        proxy_pass https://api.yima-productos.com;
    }

    # `/sitemap.xml` y `/robots.txt` los sirve el BACKEND, pero tienen que
    # estar disponibles en el dominio del FRONTEND.
    #
    # Motivo: Google no procesa un sitemap alojado en un dominio distinto al de
    # las URLs que declara, salvo que verifiques ambos dominios y los cruces.
    # Con el sitemap viviendo solo en api.yima-productos.com, hoy no lo lee
    # nadie. Por eso el proxy no es para bots: es para TODOS.
    location = /sitemap.xml {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_ssl_server_name on;
        proxy_set_header Host api.yima-productos.com;
        proxy_pass https://api.yima-productos.com/sitemap.xml;

        # nginx NO hereda los `add_header` del bloque padre en cuanto un
        # bloque define los suyos (mismo gotcha que /assets/ y /index.html):
        # sin repetirlas acá, esta respuesta se serviría sin ninguna cabecera
        # de seguridad.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $csp_policy always;
    }

    location = /robots.txt {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        proxy_ssl_server_name on;
        proxy_set_header Host api.yima-productos.com;
        proxy_pass https://api.yima-productos.com/robots.txt;

        # Mismo gotcha: sin repetirlas acá, esta respuesta se serviría sin
        # ninguna cabecera de seguridad.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $csp_policy always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html NUNCA se cachea sin revalidar. Sin cabecera explícita los
    # navegadores aplican caching heurístico, y tras un deploy pueden servir
    # un index viejo que referencia bundles hasheados que ya no existen ->
    # 404 de chunk -> pantalla blanca. `no-cache` no significa "no guardar":
    # significa "revalidá contra el servidor antes de usar la copia", que es
    # exactamente lo que quiere el HTML de entrada de una SPA con assets
    # inmutables. Los `try_files ... /index.html` de arriba hacen un redirect
    # interno que re-matchea locations, así que este bloque cubre también
    # todas las rutas de la SPA, no solo /index.html literal.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        # nginx NO hereda los `add_header` del bloque padre en cuanto un
        # bloque define los suyos (mismo gotcha que /assets/): sin repetirlas
        # acá, el HTML principal se serviría sin ninguna cabecera de
        # seguridad.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $csp_policy always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx NO hereda los `add_header` del bloque padre en cuanto un
        # bloque define los suyos: sin repetirlos acá, los bundles de JS y CSS
        # —justo donde más importa `nosniff`— se servirían sin ninguna de las
        # cabeceras de seguridad de arriba.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy $csp_policy always;
    }
}
